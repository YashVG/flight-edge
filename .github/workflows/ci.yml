# ==============================================================================
# FlightEdge CI/CD Pipeline
# Automated testing, benchmarking, and performance regression detection
# ==============================================================================

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: "1.22"

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Unit Tests
  # ----------------------------------------------------------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -short -coverprofile=coverage.out ./...

      - name: Verify offline protocol demo
        run: make demo

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          flags: unittests

  # ----------------------------------------------------------------------------
  # Linting
  # ----------------------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

  # ----------------------------------------------------------------------------
  # Performance Benchmarks
  # ----------------------------------------------------------------------------
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        run: |
          go test -run=^$ -bench=. -benchmem -count=3 -timeout=10m ./benchmarks/ | tee benchmark-results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results.txt

  # ----------------------------------------------------------------------------
  # Performance Regression Tests
  # ----------------------------------------------------------------------------
  performance-regression:
    name: Performance Regression
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run regression tests
        run: |
          go test -v -run TestPerformanceRegression -timeout=5m ./benchmarks/

      - name: Run latency validation
        run: |
          go test -v -run TestLatencyP99Under50ms -timeout=5m ./benchmarks/

      - name: Run memory constraint test
        run: |
          go test -v -run TestMemoryConstraint512MB -timeout=5m ./benchmarks/

  # ----------------------------------------------------------------------------
  # Load Tests
  # ----------------------------------------------------------------------------
  load-test:
    name: Load Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run load generator tests
        run: |
          go test -v -run "TestLoadGenerator" -timeout=5m ./benchmarks/

      - name: Run concurrent query tests
        run: |
          go test -v -run "TestConcurrentQueries" -timeout=5m ./benchmarks/

      - name: Run sustained load test
        run: |
          go test -v -run "TestSustainedLoad" -timeout=2m ./benchmarks/

  # ----------------------------------------------------------------------------
  # Build
  # ----------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build core and collector binaries
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.version=${{ github.sha }}" -trimpath -o bin/flightedge ./cmd/flightedge/
          CGO_ENABLED=0 go build -ldflags="-s -w" -trimpath -o bin/flightedge-collector ./cmd/flightedge-collector/

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: flightedge-binary
          path: bin/

  # ----------------------------------------------------------------------------
  # Docker Build
  # ----------------------------------------------------------------------------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: false
          # Make the image available to the runner's Docker smoke test.
          load: true
          tags: flightedge:${{ github.sha }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build collector Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          target: collector
          push: false
          tags: flightedge-collector:${{ github.sha }}
          cache-from: type=gha

      - name: Test Docker image
        run: |
          docker run -d --name flightedge-test -p 8080:8080 -e ENABLE_INGESTION=false flightedge:${{ github.sha }}
          trap 'docker rm -f flightedge-test' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/ready; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8080/health
          curl --fail --silent http://localhost:8080/ >/dev/null

  # ----------------------------------------------------------------------------
  # Memory Profiling (Manual Trigger)
  # ----------------------------------------------------------------------------
  profile:
    name: Memory Profiling
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run profiling tests
        run: |
          ENABLE_PROFILING=true go test -v -run "TestCPUProfile|TestMemoryProfile" -timeout=10m ./benchmarks/

      - name: Upload profiles
        uses: actions/upload-artifact@v7
        with:
          name: profiles
          path: |
            cpu.prof
            mem.prof
